name: Sync to Hugging Face Hub
on:
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 1. Configure git
          git config --global user.email "bot@scamdetect.ai"
          git config --global user.name "ScamDetect Bot"
          
          # 2. Clone the Hugging Face space into a temporary directory
          git clone https://Mayank11207:$HF_TOKEN@huggingface.co/spaces/Mayank11207/scamdetect-backend /tmp/hf_space
          
          # 3. Preserve the models folder so manual uploads aren't deleted!
          cd /tmp/hf_space
          mv backend/models /tmp/preserved_models || echo "No models to preserve"
          
          # Remove all other old files (except .git and .gitattributes)
          find . -maxdepth 1 ! -name '.git' ! -name '.gitattributes' ! -name '.' -exec rm -rf {} +
          
          # 4. Copy ONLY the Dockerfile and backend folder from GitHub
          cp $GITHUB_WORKSPACE/Dockerfile /tmp/hf_space/
          cp -r $GITHUB_WORKSPACE/backend /tmp/hf_space/
          
          # Restore the preserved models
          mkdir -p /tmp/hf_space/backend/models
          cp -r /tmp/preserved_models/* /tmp/hf_space/backend/models/ 2>/dev/null || echo "No models to restore"
          
          # 5. Generate the required Hugging Face Space configuration README
          echo "---" > /tmp/hf_space/README.md
          echo "title: ScamDetect Backend" >> /tmp/hf_space/README.md
          echo "emoji: 🕵️" >> /tmp/hf_space/README.md
          echo "colorFrom: blue" >> /tmp/hf_space/README.md
          echo "colorTo: indigo" >> /tmp/hf_space/README.md
          echo "sdk: docker" >> /tmp/hf_space/README.md
          echo "pinned: false" >> /tmp/hf_space/README.md
          echo "---" >> /tmp/hf_space/README.md
          echo "" >> /tmp/hf_space/README.md
          echo "Backend for ScamDetect AI" >> /tmp/hf_space/README.md
          
          # 6. Commit and push to Hugging Face
          git add .
          git commit -m "Auto-sync backend and fix configuration" || echo "No changes to commit"
          git push origin main
